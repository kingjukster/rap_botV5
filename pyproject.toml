[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rap-bot"
version = "5.0.0"
description = "Evolutionary rap verse generation with MAP-Elites"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0,<2.5",
    "torchvision>=0.15,<0.20",
    "torchaudio>=2.0,<2.5",
    "transformers>=4.30,<4.45",
    "accelerate>=0.20,<1.0",
    "datasets>=2.14,<3.0",
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
    "tqdm>=4.65",
    "gensim>=4.3",
    "nltk>=3.8",
    "sentence-transformers>=2.2",
    "regex>=2023.0",
    "pronouncing>=0.2.0",
    "g2p-en>=2.1",
    "networkx>=3.0",
    "python-dotenv>=1.0",
    "mysql-connector-python>=8.0",
]

[project.optional-dependencies]
full = [
    "matplotlib>=3.7",
    "fasttext>=0.9.2",
    "bitsandbytes>=0.41",
    "papermill>=2.4",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["evo_rhyme*", "config*", "rapbot*"]
