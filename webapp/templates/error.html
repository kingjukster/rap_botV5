{% extends "base.html" %}

{% block title %}Error — Rap Bot{% endblock %}

{% block content %}
<div class="max-w-xl">
    <h1 class="text-2xl font-bold text-slate-100 mb-2">Something went wrong</h1>
    <p class="text-slate-400 mb-6">{{ message | default("An unexpected error occurred. Please try again or return to the dashboard.") }}</p>
    <a href="/" class="inline-block px-4 py-2 rounded-lg bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 border border-amber-500/40">Back to Dashboard</a>
</div>
{% endblock %}
