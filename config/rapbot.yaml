base_model_name: Qwen/Qwen2.5-14B-Instruct

paths:
  adapter_dir: lora_elite_v2
  tokenizer_dir: elite_tokenizer
  rhyme_groups_csv: data/rhymes_grouped.csv
  siamese_model_dir: rhyme_siamese
  elite_corpus_path: data/elite_songs_corpus_clean_filtered.txt
  generation_log_path: data/generated_raw.jsonl
  scored_dataset_path: data/scored_dataset.jsonl
  weighted_corpus_path: data/weighted_corpus_stage3.txt
  local_critic_dir: models/local_critic

generation:
  scheme: AABB
  num_bars: 16
  candidates: 12
  max_new_tokens: 40
  temperature: 0.85
  top_p: 0.92
  repetition_penalty: 1.12
  attempts: 5
  verse_accept_threshold: 0.45
  target_syllables: 13
  meter_sigma: 1.8
  anchor_candidates_per_line: 8
  log_json: data/generated_raw.jsonl

stage3:
  samples_per_seed: 4
  parallel_workers: 1
  refresh_rhymes: true
  min_overall_score: 2.4
  min_average_score: 2.0
  hist_bins: 24
  seed_manifest: data/seeds/mfdoom_manifest.jsonl

critic:
  model: gpt-4o-mini
  sleep: 0.25
  concurrency: 3
  retry_backoff: 5.0
  max_retries: 8
  manifest_path: data/critic_manifests/run_manifest.jsonl
  input_cost_per_mtok: 0.150
  output_cost_per_mtok: 0.600

stats:
  summary_path: data/stats/stage3_summary.json
  per_seed_csv: data/stats/stage3_per_seed.csv
  histogram_path: data/stats/stage3_histograms.json
