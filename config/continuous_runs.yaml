# Run configs for scripts/run_continuous.py
# All runs use --db --runs-dir for comparison
#
# LM backend: Groq free tier (set GROQ_API_KEY + RAPBOT_REWRITER_API_BASE in .env)
# Budget kept conservative to stay within free-tier rate limits (~14,400 RPD)
#
# Improvements:
# - Added seeds for replicates (stochastic stability)
# - Standardized structure
# - Grouped experiments clearly
#
# Compare by arm in SQL:
# SELECT r.run_id, r.theme_keywords, r.status,
#        r.config_json->>'$.arm' AS arm,
#        r.config_json->>'$.seed' AS seed,
#        g.best_fitness, g.gen
# FROM runs r
# LEFT JOIN (
#     SELECT run_id, MAX(gen) AS gen, MAX(best_fitness) AS best_fitness
#     FROM generations GROUP BY run_id
# ) g ON r.run_id = g.run_id
# WHERE r.config_json->>'$.arm' IS NOT NULL
# ORDER BY arm, seed;

seeds: [1, 2, 3]
# Optional: link all runs to an experiments row (scripts/run_verse_qd --experiment-id / --arm-id)
# continuous_experiment_id: 1
# continuous_arm_id: 1
# Optional: elite replay only samples top_configs matching these rhyme schemes (comma list or YAML array)
# elite_replay_schemes: AABB, ABAB
# Policy: learned = use top configs from DB; explore_mix = epsilon-greedy
policy_mode: explore_mix
# Elite replay: probability of sampling from top_configs instead of YAML round-robin
elite_replay_fraction: 0.1
# Epsilon decay for explore_mix: reduces randomness over time
epsilon_decay_factor: 0.995
epsilon_decay_cap: 200
# LM budgets: 0 = no external API calls (pure local evolution, fastest)
lm_budget: 0
line_lm_budget: 0
# Cross-run seeding: disabled to let fresh populations explore under new weights
# (old seeds converged to gibberish that gamed stale weights)
seed_from_archive: 0
# Use ultra-compact archive (729 niches) for realistic coverage targets
archive_mode: ultra_compact
# Immigrants per generation (high to inject diverse genetic material)
immigrants: 60
# MAP-Elites / emitter exploration vs exploitation (run_verse_qd --novelty-weight)
novelty_weight: 0.45
# Anti-plateau: do NOT tighten min fluency/coherence when fitness stalls — that shrinks
# the search space exactly when you need more room to improve.
curriculum_tighten_on_stagnation: false
# Anti-plateau controls (non-LM): stop stale runs early (give a bit more room than 5 gens)
early_stop_stagnant_gens: 8
early_stop_min_delta: 0.0015
# Slightly looser floors so offspring are not filtered out before archive sees them
min_coherence: 0.34
min_rhyme_scheme_score: 0.28
# Off: DB operator priors echo past runs and can lock the loop on the same mutations
operator_db_weights: false
seed_max_per_source_run: 1
no_seed_diversify: false

runs:

  ########################################
  # 1. THEME SWEEP
  ########################################

  - arm: theme_pressure
    theme: pressure,mask,survival
    population: 120
    generations: 30
    scheme: AABB
    init: mixed

  - arm: theme_crown
    theme: crown,empire,power
    population: 120
    generations: 30
    scheme: AABB
    init: mixed

  - arm: theme_flow
    theme: flow,show,dream
    population: 120
    generations: 30
    scheme: AABB
    init: mixed

  - arm: theme_street
    theme: street,king,war
    population: 120
    generations: 30
    scheme: AABB
    init: mixed


  ########################################
  # 2. INIT MODE SWEEP
  ########################################

  - arm: init_random
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: AABB
    init: random

  - arm: init_template
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: AABB
    init: template

  - arm: init_mixed
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: AABB
    init: mixed


  ########################################
  # 3. POPULATION SWEEP
  ########################################

  - arm: pop40
    theme: pressure,mask,survival
    population: 40
    generations: 20
    scheme: AABB
    init: mixed

  - arm: pop60_base
    theme: pressure,mask,survival
    population: 60
    generations: 20
    scheme: AABB
    init: mixed

  - arm: pop80
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: AABB
    init: mixed


  ########################################
  # 4. SCHEME SWEEP
  ########################################

  - arm: scheme_AABB_base
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: AABB
    init: mixed

  - arm: scheme_ABAB
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: ABAB
    init: mixed

  - arm: scheme_ABBA
    theme: pressure,mask,survival
    population: 80
    generations: 20
    scheme: ABBA
    init: mixed