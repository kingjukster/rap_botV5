runner: couplet
experiment_name: ab_static_vs_learned
description: controlled uplift test static vs learned
mode: single_control
n_seeds_per_arm: 6
run_timeout_seconds: 7200
fixed_controls:
  theme: pressure,mask,survival
  population: 60
  generations: 10
  elites: 5
  immigrants: 8
  init: mixed
treatments:
  - arm_name: static
    controls:
      policy_mode: static
  - arm_name: learned
    controls:
      policy_mode: learned
