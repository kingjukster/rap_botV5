services:
  mysql:
    image: mysql:8.0
    container_name: rapbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rapbot
      MYSQL_USER: rapbot
      MYSQL_PASSWORD: rapbot
    ports:
      - "3307:3306"
    volumes:
      - rapbot_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: rapbot-web
    restart: unless-stopped
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RAPBOT_USE_DB: "1"
      RAPBOT_DB_HOST: mysql
      RAPBOT_DB_PORT: "3306"
      RAPBOT_DB_USER: rapbot
      RAPBOT_DB_PASSWORD: rapbot
      RAPBOT_DB_NAME: rapbot
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rapbot_mysql_data:
