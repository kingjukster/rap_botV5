services:
  mysql:
    image: mysql:8.0
    container_name: rapbot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: rapbot
      MYSQL_USER: rapbot
      MYSQL_PASSWORD: rapbot
    ports:
      - "3307:3306"
    volumes:
      - rapbot_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rapbot-web
    restart: unless-stopped
    command: ["sh", "/app/scripts/start_web_with_tunnel.sh"]
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      RAPBOT_USE_DB: "1"
      RAPBOT_DB_HOST: mysql
      RAPBOT_DB_PORT: "3306"
      RAPBOT_DB_USER: rapbot
      RAPBOT_DB_PASSWORD: rapbot
      RAPBOT_DB_NAME: rapbot
      RAPBOT_DOCKER_NETWORK: rap_botv5_default
      RAPBOT_HOST_PROJECT_PATH: ${PWD:-.}
      RAPBOT_EVOLUTION_IMAGE: rap_botv5_evolution
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy

  # Run on-demand: docker compose --profile evolution run --rm evolution python scripts/run_verse_evolution.py --theme "pressure,mask" --population 30 --generations 5
  # For no-OpenAI runs: RAPBOT_DISABLE_LM_REWRITER=1 docker compose --profile evolution run --rm evolution ...
  evolution:
    build:
      context: .
      dockerfile: docker/evolution.Dockerfile
    container_name: rapbot-evolution
    env_file: .env
    environment:
      RAPBOT_USE_DB: "1"
      RAPBOT_DB_HOST: mysql
      RAPBOT_DB_PORT: "3306"
      RAPBOT_DB_USER: rapbot
      RAPBOT_DB_PASSWORD: rapbot
      RAPBOT_DB_NAME: rapbot
      RAPBOT_DISABLE_LM_REWRITER: ${RAPBOT_DISABLE_LM_REWRITER:-}
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - evolution  # Not started by default; use: docker compose --profile evolution run evolution ...

volumes:
  rapbot_mysql_data:
